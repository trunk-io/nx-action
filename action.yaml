name: Trunk Compute Impacted Targets For Nx
author: trunk.io
description: Trunk.io Github Action to Compute and Upload Impacted Targets for Nx powered repos

inputs:
  auth:
    description: >-
      How the upload authenticates. `trunk-token` (default) uses the trunk-token input.
      `github-actions` logs in with the run's own GitHub credential through trunk-io/login: no Trunk
      secret, pull requests from forks included. It needs `permissions: id-token: write` on the job,
      and for fork PRs, Fork PR CI access turned on for the repository in Trunk.
    required: false
    default: trunk-token
  trunk-api-url:
    description: >-
      The Trunk API root for `auth: github-actions`. Change it only for Trunk's staging environment.
    required: false
    default: https://api.trunk.io/v2
  trunk-token:
    description:
      Repo or Organization API token used for authentication. Can be found at app.trunk.io.
    required: false # Required unless auth is github-actions or the workflow comes from a forked PR.
  target-branch:
    description:
      The branch that the Merge Queue merges PRs into. If unspecified, defaults to the repository's
      default branch.
    required: false
  verbose:
    description: Whether to enable verbose logging. Defaults to false.
    required: false
  workspace-path:
    description: Path to your Nx workspace. If none is provided, will use the root directory.
    required: false
  impact-all-filters-path:
    description:
      A path to a list of filters to identify whether `ALL` impacted targets should be considered.
      See https://github.com/dorny/paths-filter/blob/master/.github/filters.yml for an example. If a
      PR changes files in any of these paths, then *any* PRs queued after this one will depend on
      it.
    required: false
    default: ""
  package-manager:
    description:
      The package manager to use (one of `pnpm`, `yarn`, `npm`). If unspecified, will be detected
      from the lock file present in the workspace.
    required: false
    default: ""
  skip-install:
    description:
      Whether to skip the package manager install step. Useful when packages have already been
      installed in a prior step. Defaults to false.
    required: false
    default: ""
  nx-bin:
    description:
      A command or path used to invoke Nx (for example a pre-installed `nx` shim). When set, the
      action runs `nx show projects` with this instead of the detected package manager, and it skips
      the package manager install step. Computing impacted targets needs the project graph, not
      installed dependencies, so no install is required. Useful when Nx is provided outside the
      workspace `node_modules`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate auth
      if: ${{ inputs.auth != 'trunk-token' && inputs.auth != 'github-actions' }}
      shell: bash
      run: |
        echo "::error::auth must be trunk-token or github-actions"
        exit 1

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install requests==2.31.0
      shell: bash

    - name: Detect changed paths
      id: detect-changed-paths
      if: ${{ inputs.impact-all-filters-path != '' }}
      uses: dorny/paths-filter@v2
      with:
        filters: ${{ inputs.impact-all-filters-path }}

    - name: Prerequisites
      id: prerequisites
      run: python ${GITHUB_ACTION_PATH}/src/prerequisites.py
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        PR_BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        IMPACTS_FILTERS_CHANGES: ${{ steps.detect-changed-paths.outputs.changes }}
        VERBOSE: ${{ inputs.verbose }}

    - name: Compute Impacted Targets
      if: ${{ steps.prerequisites.outputs.impacts_all_detected == 'false' }}
      id: compute-impacted-targets
      working-directory: ${{ inputs.workspace-path || '.' }}
      run: python ${GITHUB_ACTION_PATH}/src/compute_impacted_targets.py
      shell: bash
      env:
        MERGE_INSTANCE_BRANCH: ${{ steps.prerequisites.outputs.merge_instance_branch }}
        MERGE_INSTANCE_BRANCH_HEAD_SHA:
          ${{ steps.prerequisites.outputs.merge_instance_branch_head_sha }}
        PR_BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TRUNK_TOKEN: ${{ inputs.trunk-token }}
        VERBOSE: ${{ inputs.verbose }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        SKIP_INSTALL: ${{ inputs.skip-install }}
        NX_BIN: ${{ inputs.nx-bin }}

    - name: Upload Impacted Targets
      id: upload-impacted-targets
      if: ${{ inputs.auth != 'github-actions' }}
      working-directory: ${{ inputs.workspace-path || '.' }}
      run: python ${GITHUB_ACTION_PATH}/src/upload_impacted_targets.py
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
        API_TOKEN: ${{ inputs.trunk-token }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        MERGE_INSTANCE_BRANCH: ${{ steps.prerequisites.outputs.merge_instance_branch }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TRUNK_TOKEN: ${{ inputs.trunk-token }}
        VERBOSE: ${{ inputs.verbose }}
        IMPACTS_ALL_DETECTED: ${{ steps.prerequisites.outputs.impacts_all_detected }}
        IMPACTED_TARGETS_FILE: ${{ steps.compute-impacted-targets.outputs.impacted_targets_out }}

    - name: Log in to Trunk
      if: ${{ inputs.auth == 'github-actions' }}
      uses: trunk-io/login@dd43b5c040326ee204a3d1f18f5522a717466ce2 # main; move to v1 once tagged
      with:
        api-url: ${{ inputs.trunk-api-url }}

    - name: Upload Impacted Targets (GitHub Actions login)
      if: ${{ inputs.auth == 'github-actions' }}
      # The targets file path is relative to the workspace.
      working-directory: ${{ inputs.workspace-path || '.' }}
      run: ${GITHUB_ACTION_PATH}/src/scripts/upload_impacted_targets_github_actions.sh
      shell: bash
      env:
        # Lets a long fork-PR job renew its login.
        GITHUB_TOKEN: ${{ github.token }}
        TARGET_BRANCH: ${{ steps.prerequisites.outputs.merge_instance_branch }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_SHA: ${{ github.event.pull_request.head.sha }}
        IMPACTED_TARGETS_FILE: ${{ steps.compute-impacted-targets.outputs.impacted_targets_out }}
        IMPACTS_ALL_DETECTED: ${{ steps.prerequisites.outputs.impacts_all_detected }}
